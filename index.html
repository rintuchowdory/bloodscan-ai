<!doctype html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BloodScan AI — Prototype v0.1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg: #EFF3F1;
    --panel: #FFFFFF;
    --ink: #16231F;
    --ink-soft: #52605A;
    --line: #D6DEDA;
    --teal: #1B6E63;
    --teal-dark: #10453D;
    --teal-tint: #E3EFEC;
    --amber: #A5680E;
    --amber-tint: #FBF1DF;
    --danger: #A93A2E;
    --danger-tint: #F7E9E6;
    --focus: #1B6E63;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family:'Space Grotesk', 'IBM Plex Sans', sans-serif; margin:0; }
  button{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .frame{
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  /* ---- disclaimer ---- */
  .disclaimer{
    background: var(--danger-tint);
    border-bottom: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 16px;
    font-size: 12.5px;
    line-height: 1.45;
    display:flex;
    gap:8px;
  }

  /* ---- hero ---- */
  .hero{
    position: relative;
    height: 190px;
    overflow: hidden;
    background: linear-gradient(135deg, #0F3D37 0%, #5C1C17 65%, #7A1F1B 100%);
    flex-shrink: 0;
  }
  .hero-canvas{ position:absolute; inset:0; }
  .hero-canvas canvas{ display:block; width:100% !important; height:100% !important; }
  .hero-copy{
    position:absolute; left:20px; bottom:16px; z-index:2; color:#fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .hero-copy .title{ font-size:25px; font-weight:700; letter-spacing:-0.01em; }
  .hero-copy .subtitle{ font-size:11.5px; font-family:'IBM Plex Mono', monospace; opacity:0.92; margin-top:5px; }
  .hero .lang-toggle{
    position:absolute; top:14px; right:16px; z-index:2;
    background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); backdrop-filter: blur(6px);
  }
  .hero .lang-toggle button{ background:transparent; color:#fff; }
  .hero .lang-toggle button.active{ background:#fff; color: var(--teal-dark); }
  .lang-toggle{ display:flex; border:1px solid var(--line); border-radius: 20px; overflow:hidden; height: fit-content; }
  .lang-toggle button{ background: var(--panel); border:none; padding:6px 12px; font-size:12px; color: var(--ink-soft); cursor:pointer; }

  /* ---- tabs ---- */
  nav.tabs{ display:flex; border-bottom: 1px solid var(--line); }
  nav.tabs button{
    flex:1; background:none; border:none; padding: 12px 0; font-size: 13.5px; font-weight:600;
    color: var(--ink-soft); cursor:pointer; border-bottom: 3px solid transparent;
  }
  nav.tabs button.active{ color: var(--teal-dark); border-bottom-color: var(--teal); }

  main{ flex:1; padding: 18px 20px 100px; }
  section.view{ display:none; }
  section.view.active{ display:block; animation: reveal 0.35s ease; }
  @keyframes reveal{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform:none; } }

  /* ---- capture frame ---- */
  .capture{
    position: relative; aspect-ratio: 4/3; background: #0F1512; border-radius: 6px; overflow: hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .capture video, .capture img{ width:100%; height:100%; object-fit: cover; display:block; }
  .capture .empty{ color:#C9D3CE; font-size:12.5px; text-align:center; padding: 0 30px; font-family:'IBM Plex Mono', monospace; }
  .brackets{ position:absolute; inset:14px; pointer-events:none; }
  .brackets svg{ width:100%; height:100%; }
  .brackets path{ stroke:#EDEAD9; stroke-width:2.5; fill:none; opacity:0.85; }

  .capture-controls{ display:flex; gap:10px; margin-top: 12px; }
  .btn{
    flex:1; padding: 12px 10px; border-radius: 8px; border:1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 13.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn.primary{ background: linear-gradient(135deg,var(--teal),var(--teal-dark)); border-color: var(--teal-dark); color:#fff; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  input[type=file]{ display:none; }

  /* ---- quality report ---- */
  .card{ border:1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 16px; background: var(--panel); }
  .card h3{ font-size: 13px; color: var(--ink-soft); font-weight:600; margin-bottom: 10px; }
  .qrow{ display:flex; justify-content:space-between; align-items:center; padding: 6px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
  .qrow:last-child{ border-bottom:none; }
  .pill{ font-size: 11.5px; padding: 3px 8px; border-radius: 12px; font-weight:600; font-family:'IBM Plex Mono',monospace; }
  .pill.good{ background: var(--teal-tint); color: var(--teal-dark); }
  .pill.warn{ background: var(--amber-tint); color: var(--amber); }

  .readiness{ display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600; margin-top:12px; color:#fff; }
  .readiness.ready{ background: linear-gradient(90deg,#1B6E63,#2C9A87); }
  .readiness.retake{ background: linear-gradient(90deg,#C77B12,#E0A233); }

  /* ---- zones ---- */
  .zones{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-top: 16px; }
  .zone{ border:1px solid var(--line); border-top-width:3px; border-radius:8px; padding: 12px 8px; text-align:center; }
  .zone.a{ border-top-color:#1B6E63; }
  .zone.b{ border-top-color:#C77B12; }
  .zone.d{ border-top-color:#A93A2E; }
  .zone .label{ font-size:12px; font-weight:600; color: var(--ink-soft); }
  .zone .state{ margin-top:8px; font-size: 11px; color:#8A9490; font-family:'IBM Plex Mono',monospace; }

  .note{ font-size: 12px; color: var(--ink-soft); margin-top: 14px; line-height:1.5; }
  .save-row{ margin-top: 18px; display:flex; gap:10px; }

  /* ---- history / dashboard ---- */
  .stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom: 18px; }
  .stat-card{ border-radius:10px; padding:13px 8px; color:#fff; text-align:center; }
  .stat-card .num{ font-size:21px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
  .stat-card .lbl{ font-size:10px; margin-top:3px; opacity:0.92; font-family:'IBM Plex Mono',monospace; }
  .stat-card.teal{ background:linear-gradient(135deg,#1B6E63,#0F3D37); }
  .stat-card.amber{ background:linear-gradient(135deg,#C77B12,#8A560B); }
  .stat-card.crimson{ background:linear-gradient(135deg,#A93A2E,#6E241B); }

  .hist-item{ display:flex; gap:12px; border:1px solid var(--line); border-radius:8px; padding: 10px; margin-bottom: 10px; align-items:center; }
  .hist-item img{ width:56px; height:56px; object-fit:cover; border-radius:6px; background:#eee; }
  .hist-meta{ flex:1; min-width:0; }
  .hist-meta .ts{ font-size:12.5px; font-weight:600; }
  .hist-meta .sum{ font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
  .hist-del{ background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer; padding:6px; }
  .empty-hist{ color: var(--ink-soft); font-size: 13px; text-align:center; padding: 40px 10px; }

  footer{
    border-top:1px solid var(--line); padding: 12px 20px; overflow-x:auto; white-space:nowrap; background: var(--panel);
    max-width:460px; margin:0 auto; position:sticky; bottom:0; width:100%;
  }
  .roadmap{ display:inline-flex; gap:14px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; }
  .roadmap span{ color:#B7C0BB; }
  .roadmap span.now{ background: linear-gradient(90deg,#1B6E63,#A93A2E); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }
</style>
</head>
<body>
<div class="frame">

  <div class="disclaimer">
    <span>⚠️</span>
    <span data-i18n="disclaimer"></span>
  </div>

  <div class="hero">
    <div class="hero-canvas" id="heroCanvas"></div>
    <div class="lang-toggle">
      <button id="lang-en" class="active">EN</button>
      <button id="lang-de">DE</button>
    </div>
    <div class="hero-copy">
      <div class="title">BloodScan AI</div>
      <div class="subtitle" data-i18n="subtitle"></div>
    </div>
  </div>

  <nav class="tabs">
    <button id="tab-scan-btn" class="active" data-i18n="tabScan"></button>
    <button id="tab-history-btn" data-i18n="tabHistory"></button>
  </nav>

  <main>
    <!-- SCAN VIEW -->
    <section id="view-scan" class="view active">
      <div class="capture" id="captureBox">
        <video id="video" playsinline muted style="display:none"></video>
        <img id="preview" style="display:none" />
        <div class="empty" id="captureEmpty" data-i18n="captureEmpty"></div>
        <div class="brackets">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M0,14 L0,0 L14,0" />
            <path d="M86,0 L100,0 L100,14" />
            <path d="M100,86 L100,100 L86,100" />
            <path d="M14,100 L0,100 L0,86" />
          </svg>
        </div>
      </div>

      <div class="capture-controls">
        <button class="btn" id="btnCamera" data-i18n="btnCamera"></button>
        <button class="btn" id="btnUpload" data-i18n="btnUpload"></button>
        <input type="file" id="fileInput" accept="image/*" capture="environment" />
      </div>

      <div class="card" id="qualityCard" style="display:none">
        <h3 data-i18n="qualityTitle"></h3>
        <div class="qrow"><span data-i18n="qBrightness"></span><span class="pill" id="qBrightnessVal">—</span></div>
        <div class="qrow"><span data-i18n="qSharpness"></span><span class="pill" id="qSharpnessVal">—</span></div>
        <div class="qrow"><span data-i18n="qAlignment"></span><span class="pill warn" id="qAlignmentVal">—</span></div>
        <div class="readiness" id="readinessBadge"></div>
      </div>

      <div class="zones" id="zonesBox" style="display:none">
        <div class="zone a"><div class="label">Anti-A</div><div class="state" data-i18n="zoneState"></div></div>
        <div class="zone b"><div class="label">Anti-B</div><div class="state" data-i18n="zoneState"></div></div>
        <div class="zone d"><div class="label">Anti-D</div><div class="state" data-i18n="zoneState"></div></div>
      </div>

      <p class="note" id="scanNote" data-i18n="scanNote" style="display:none"></p>

      <div class="save-row" id="saveRow" style="display:none">
        <button class="btn primary" id="btnSave" data-i18n="btnSave"></button>
        <button class="btn" id="btnDiscard" data-i18n="btnDiscard"></button>
      </div>
    </section>

    <!-- HISTORY VIEW -->
    <section id="view-history" class="view">
      <div class="stats-row" id="statsRow"></div>
      <div id="historyList"></div>
      <div class="empty-hist" id="emptyHist" data-i18n="emptyHist"></div>
    </section>
  </main>

  <footer>
    <div class="roadmap">
      <span class="now">● v0.1 UI</span>
      <span>○ v0.2 Camera engine</span>
      <span>○ v0.3 Card CV</span>
      <span>○ v0.4 Dataset</span>
      <span>○ v0.5 Agglutination ML</span>
      <span>○ v0.6 ABO/Rh engine</span>
      <span>○ v0.7 Confidence/QC</span>
      <span>○ v0.8 Cross-device</span>
      <span>○ v0.9 Standard card</span>
      <span>○ v1.0 Validation</span>
    </div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<script>
(function(){
  const STRINGS = {
    en: {
      disclaimer: "Prototype only — not a medical device. This app never diagnoses a blood type. Software development & demo purposes only.",
      subtitle: "software prototype · phase 1 (UI)",
      tabScan: "Scan",
      tabHistory: "History",
      captureEmpty: "Line up a test card inside the brackets, or upload a photo.",
      btnCamera: "📷 Open camera",
      btnUpload: "🖼 Upload photo",
      qualityTitle: "Image quality (heuristic, not diagnostic)",
      qBrightness: "Brightness",
      qSharpness: "Sharpness (approx.)",
      qAlignment: "Card alignment",
      zoneState: "not analyzed yet",
      scanNote: "Reaction-zone detection and interpretation are not implemented in this prototype — planned for phases 3, 5 and 6, and requiring proper clinical validation before any real use.",
      btnSave: "Save to history",
      btnDiscard: "Discard",
      emptyHist: "No scans saved yet.",
      manualAlign: "manual — auto-detect planned",
      good: "good", low: "low", high: "high", approx: "approx.",
      delete: "Delete",
      ready: "Image ready for the pipeline", retake: "Retake suggested",
      statsTotal: "Scans saved", statsGood: "Good quality", statsLast: "Last scan"
    },
    de: {
      disclaimer: "Nur Prototyp — kein Medizinprodukt. Diese App bestimmt niemals eine Blutgruppe. Nur für Softwareentwicklung & Demonstration.",
      subtitle: "Software-Prototyp · Phase 1 (UI)",
      tabScan: "Scan",
      tabHistory: "Verlauf",
      captureEmpty: "Testkarte innerhalb der Ecken ausrichten oder Foto hochladen.",
      btnCamera: "📷 Kamera öffnen",
      btnUpload: "🖼 Foto hochladen",
      qualityTitle: "Bildqualität (Heuristik, keine Diagnose)",
      qBrightness: "Helligkeit",
      qSharpness: "Schärfe (ca.)",
      qAlignment: "Kartenausrichtung",
      zoneState: "noch nicht analysiert",
      scanNote: "Die Erkennung und Interpretation der Reaktionszonen ist in diesem Prototyp nicht implementiert — geplant für Phase 3, 5 und 6, und erfordert vor jedem echten Einsatz eine ordentliche klinische Validierung.",
      btnSave: "In Verlauf speichern",
      btnDiscard: "Verwerfen",
      emptyHist: "Noch keine Scans gespeichert.",
      manualAlign: "manuell — Auto-Erkennung geplant",
      good: "gut", low: "niedrig", high: "hoch", approx: "ca.",
      delete: "Löschen",
      ready: "Bild bereit für die Pipeline", retake: "Erneut aufnehmen empfohlen",
      statsTotal: "Scans gespeichert", statsGood: "Gute Qualität", statsLast: "Letzter Scan"
    }
  };

  let lang = 'en';
  let currentDataUrl = null;
  let stream = null;
  let lastReady = false;

  function t(key){ return STRINGS[lang][key] || key; }

  function applyI18n(){
    document.getElementById('html-root').lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
    document.getElementById('lang-en').classList.toggle('active', lang==='en');
    document.getElementById('lang-de').classList.toggle('active', lang==='de');
    document.getElementById('qAlignmentVal').textContent = t('manualAlign');
    renderHistory();
  }
  document.getElementById('lang-en').onclick = ()=>{ lang='en'; applyI18n(); };
  document.getElementById('lang-de').onclick = ()=>{ lang='de'; applyI18n(); };

  // ---- tabs ----
  const tabScanBtn = document.getElementById('tab-scan-btn');
  const tabHistBtn = document.getElementById('tab-history-btn');
  const viewScan = document.getElementById('view-scan');
  const viewHist = document.getElementById('view-history');
  tabScanBtn.onclick = ()=>{
    tabScanBtn.classList.add('active'); tabHistBtn.classList.remove('active');
    viewScan.classList.add('active'); viewHist.classList.remove('active');
  };
  tabHistBtn.onclick = ()=>{
    tabHistBtn.classList.add('active'); tabScanBtn.classList.remove('active');
    viewHist.classList.add('active'); viewScan.classList.remove('active');
    renderHistory();
  };

  // ---- capture ----
  const video = document.getElementById('video');
  const preview = document.getElementById('preview');
  const captureEmpty = document.getElementById('captureEmpty');
  const fileInput = document.getElementById('fileInput');

  document.getElementById('btnUpload').onclick = ()=> fileInput.click();
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    stopCamera();
    const reader = new FileReader();
    reader.onload = (ev)=>{ showImage(ev.target.result); };
    reader.readAsDataURL(file);
  });

  document.getElementById('btnCamera').onclick = async ()=>{
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      video.style.display = 'block';
      preview.style.display = 'none';
      captureEmpty.style.display = 'none';
      await video.play();
      setTimeout(captureFrame, 600);
    }catch(err){
      alert(lang==='de'
        ? 'Kamerazugriff nicht möglich (Berechtigung/Browser). Bitte stattdessen ein Foto hochladen.'
        : 'Camera access unavailable (permission/browser). Please upload a photo instead.');
    }
  };

  function captureFrame(){
    if(!stream) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth || 640;
    c.height = video.videoHeight || 480;
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    showImage(c.toDataURL('image/jpeg', 0.85));
    stopCamera();
  }
  function stopCamera(){
    if(stream){ stream.getTracks().forEach(tr=>tr.stop()); stream=null; }
    video.style.display = 'none';
  }
  function showImage(dataUrl){
    currentDataUrl = dataUrl;
    preview.src = dataUrl;
    preview.style.display = 'block';
    video.style.display = 'none';
    captureEmpty.style.display = 'none';
    runQualityCheck(dataUrl);
  }
  document.getElementById('btnDiscard').onclick = resetCapture;
  function resetCapture(){
    currentDataUrl = null;
    preview.style.display = 'none';
    captureEmpty.style.display = 'block';
    document.getElementById('qualityCard').style.display = 'none';
    document.getElementById('zonesBox').style.display = 'none';
    document.getElementById('scanNote').style.display = 'none';
    document.getElementById('saveRow').style.display = 'none';
  }

  // ---- quality heuristic (image quality only — never a blood-type result) ----
  function runQualityCheck(dataUrl){
    const img = new Image();
    img.onload = ()=>{
      const size = 160;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0,0,size,size).data;

      let sum = 0;
      const gray = new Float32Array(size*size);
      for(let i=0, p=0; i<data.length; i+=4, p++){
        const g = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
        gray[p] = g; sum += g;
      }
      const avgBrightness = sum / gray.length;

      let edgeEnergy = 0, count = 0;
      for(let y=0; y<size; y++){
        for(let x=0; x<size-1; x++){
          const idx = y*size+x;
          edgeEnergy += Math.abs(gray[idx] - gray[idx+1]);
          count++;
        }
      }
      const sharpness = edgeEnergy / count;

      let brightGood = true;
      const brightPill = document.getElementById('qBrightnessVal');
      if(avgBrightness < 60){ brightPill.textContent = t('low'); brightPill.className='pill warn'; brightGood=false; }
      else if(avgBrightness > 205){ brightPill.textContent = t('high'); brightPill.className='pill warn'; brightGood=false; }
      else { brightPill.textContent = t('good'); brightPill.className='pill good'; }

      let sharpGood = true;
      const sharpPill = document.getElementById('qSharpnessVal');
      if(sharpness < 6){ sharpPill.textContent = t('low'); sharpPill.className='pill warn'; sharpGood=false; }
      else { sharpPill.textContent = t('good') + ' (' + t('approx') + ')'; sharpPill.className='pill good'; }

      lastReady = brightGood && sharpGood;
      const badge = document.getElementById('readinessBadge');
      badge.textContent = (lastReady ? '✓ ' : '↻ ') + (lastReady ? t('ready') : t('retake'));
      badge.className = 'readiness ' + (lastReady ? 'ready' : 'retake');

      document.getElementById('qualityCard').style.display = 'block';
      document.getElementById('zonesBox').style.display = 'grid';
      document.getElementById('scanNote').style.display = 'block';
      document.getElementById('saveRow').style.display = 'flex';
    };
    img.src = dataUrl;
  }

  // ---- history (persisted via window.storage, personal / not shared) ----
  const HKEY = 'bloodscan:history';
  function thumb(dataUrl, cb){
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = 96; c.height = 96;
      c.getContext('2d').drawImage(img, 0, 0, 96, 96);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = dataUrl;
  }
  async function loadHistory(){
    try{ const res = await window.storage.get(HKEY, false); return res ? JSON.parse(res.value) : []; }
    catch(e){ return []; }
  }
  async function persistHistory(list){
    try{ await window.storage.set(HKEY, JSON.stringify(list), false); }
    catch(e){ console.error('storage error', e); }
  }

  document.getElementById('btnSave').onclick = async ()=>{
    if(!currentDataUrl) return;
    thumb(currentDataUrl, async (thumbUrl)=>{
      const bp = document.getElementById('qBrightnessVal').textContent;
      const sp = document.getElementById('qSharpnessVal').textContent;
      const list = await loadHistory();
      list.unshift({
        id: Date.now(),
        ts: new Date().toLocaleString(lang==='de' ? 'de-DE' : 'en-GB'),
        thumb: thumbUrl,
        brightness: bp,
        sharpness: sp,
        ready: lastReady
      });
      await persistHistory(list.slice(0, 50));
      resetCapture();
      tabHistBtn.click();
    });
  };

  async function renderHistory(){
    const listEl = document.getElementById('historyList');
    const emptyEl = document.getElementById('emptyHist');
    const statsEl = document.getElementById('statsRow');
    const list = await loadHistory();

    if(list.length === 0){
      statsEl.innerHTML = '';
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    const goodCount = list.filter(x=>x.ready).length;
    const last = list[0];
    statsEl.innerHTML = `
      <div class="stat-card teal"><div class="num">${list.length}</div><div class="lbl">${t('statsTotal')}</div></div>
      <div class="stat-card amber"><div class="num">${goodCount}</div><div class="lbl">${t('statsGood')}</div></div>
      <div class="stat-card crimson"><div class="num">${last.ts.split(',')[0]}</div><div class="lbl">${t('statsLast')}</div></div>
    `;

    listEl.innerHTML = '';
    list.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'hist-item';
      row.innerHTML = `
        <img src="${item.thumb}" alt="" />
        <div class="hist-meta">
          <div class="ts">${item.ts}</div>
          <div class="sum">${t('qBrightness')}: ${item.brightness} · ${t('qSharpness')}: ${item.sharpness}</div>
        </div>
        <button class="hist-del" data-id="${item.id}">${t('delete')}</button>
      `;
      row.querySelector('.hist-del').onclick = async ()=>{
        const cur = await loadHistory();
        await persistHistory(cur.filter(x=>x.id !== item.id));
        renderHistory();
      };
      listEl.appendChild(row);
    });
  }

  // ---- hero 3D blood-drop animation (decorative; paused when tab hidden for efficiency) ----
  let rafId = null;
  function initHero(){
    const holder = document.getElementById('heroCanvas');
    if(typeof THREE === 'undefined' || !holder) return;
    try{
      const w = holder.clientWidth, h = holder.clientHeight;
      const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true, powerPreference:'low-power' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h);
      holder.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, w/h, 0.1, 20);
      camera.position.set(0, 0.35, 3.3);
      camera.lookAt(0, 0.55, 0);

      scene.add(new THREE.HemisphereLight(0xffe6df, 0x140a08, 0.65));
      const key = new THREE.PointLight(0xffffff, 1.3); key.position.set(2.2, 3, 2.5); scene.add(key);
      const rim = new THREE.PointLight(0xff6a52, 0.8); rim.position.set(-2, -0.5, 2); scene.add(rim);

      // teardrop profile -> lathe geometry
      const pts = [
        new THREE.Vector2(0.00, 0.00),
        new THREE.Vector2(0.55, 0.05),
        new THREE.Vector2(0.78, 0.38),
        new THREE.Vector2(0.68, 0.80),
        new THREE.Vector2(0.42, 1.15),
        new THREE.Vector2(0.14, 1.38),
        new THREE.Vector2(0.00, 1.52)
      ];
      const dropGeo = new THREE.LatheGeometry(pts, 32);
      const dropMat = new THREE.MeshPhysicalMaterial({
        color: 0xB3221B, roughness:0.22, metalness:0.05, clearcoat:1, clearcoatRoughness:0.12
      });
      const drop = new THREE.Mesh(dropGeo, dropMat);
      drop.position.y = -0.5;
      const dropGroup = new THREE.Group();
      dropGroup.add(drop);
      scene.add(dropGroup);

      // small orbiting "cell" discs
      const cellMat = new THREE.MeshStandardMaterial({ color:0xD1483A, roughness:0.4, metalness:0.05 });
      const cells = [];
      const cellCount = 7;
      for(let i=0;i<cellCount;i++){
        const geo = new THREE.SphereGeometry(0.09 + Math.random()*0.03, 12, 12);
        const m = new THREE.Mesh(geo, cellMat);
        m.scale.y = 0.35;
        scene.add(m);
        cells.push({
          mesh:m,
          radius: 1.15 + Math.random()*0.55,
          speed: 0.25 + Math.random()*0.35,
          phase: Math.random()*Math.PI*2,
          yBase: 0.15 + Math.random()*0.9,
          yAmp: 0.06 + Math.random()*0.06
        });
      }

      let hidden = document.hidden;
      document.addEventListener('visibilitychange', ()=>{
        hidden = document.hidden;
        if(!hidden && rafId === null) animate();
      });

      const clock = new THREE.Clock();
      function animate(){
        if(hidden){ rafId = null; return; }
        rafId = requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        dropGroup.rotation.y = t * 0.35;
        dropGroup.position.y = Math.sin(t*1.1) * 0.06;
        cells.forEach(c=>{
          const a = t*c.speed + c.phase;
          c.mesh.position.set(Math.cos(a)*c.radius, c.yBase + Math.sin(t*0.6+c.phase)*c.yAmp, Math.sin(a)*c.radius*0.6 - 0.3);
        });
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', ()=>{
        const nw = holder.clientWidth, nh = holder.clientHeight;
        if(nw===0||nh===0) return;
        camera.aspect = nw/nh; camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      });
    }catch(e){ console.warn('3D hero skipped:', e); }
  }

  applyI18n();
  initHero();
})();
</script>
