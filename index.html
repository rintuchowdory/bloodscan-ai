<!doctype html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BloodScan AI — Prototype v0.2.2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg: #EFF3F1;
    --panel: #FFFFFF;
    --ink: #16231F;
    --ink-soft: #52605A;
    --line: #D6DEDA;
    --teal: #1B6E63;
    --teal-dark: #10453D;
    --teal-tint: #E3EFEC;
    --amber: #A5680E;
    --amber-tint: #FBF1DF;
    --danger: #A93A2E;
    --danger-tint: #F7E9E6;
    --violet: #6B4FA1;
    --violet-tint: #EFEBF8;
    --focus: #1B6E63;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1,h2,h3{ font-family:'Space Grotesk', 'IBM Plex Sans', sans-serif; margin:0; }
  button{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .frame{
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  /* ---- disclaimer ---- */
  .disclaimer{
    background: var(--danger-tint);
    border-bottom: 1px solid var(--danger);
    color: var(--danger);
    padding: 8px 16px;
    font-size: 11.5px;
    line-height: 1.45;
    display:flex;
    gap:8px;
  }

  /* ---- hero ---- */
  .hero{
    position: relative;
    height: 170px;
    overflow: hidden;
    background: linear-gradient(135deg, #0F3D37 0%, #5C1C17 65%, #7A1F1B 100%);
    flex-shrink: 0;
  }
  .hero-canvas{ position:absolute; inset:0; }
  .hero-canvas canvas{ display:block; width:100% !important; height:100% !important; }
  .hero-copy{
    position:absolute; left:20px; bottom:14px; z-index:2; color:#fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .hero-copy .title{ font-size:24px; font-weight:700; letter-spacing:-0.01em; }
  .hero-copy .subtitle{ font-size:11.5px; font-family:'IBM Plex Mono', monospace; opacity:0.92; margin-top:5px; }
  .hero .lang-toggle{
    position:absolute; top:14px; right:16px; z-index:2;
    background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); backdrop-filter: blur(6px);
  }
  .hero .lang-toggle button{ background:transparent; color:#fff; }
  .hero .lang-toggle button.active{ background:#fff; color: var(--teal-dark); }
  .lang-toggle{ display:flex; border:1px solid var(--line); border-radius: 20px; overflow:hidden; height: fit-content; }
  .lang-toggle button{ background: var(--panel); border:none; padding:6px 12px; font-size:12px; color: var(--ink-soft); cursor:pointer; }

  /* ---- tabs (colorful per tool) ---- */
  nav.tabs{ display:flex; border-bottom: 1px solid var(--line); }
  nav.tabs button{
    flex:1; background:none; border:none; padding: 11px 0 10px; font-size: 12.5px; font-weight:600;
    color: var(--ink-soft); cursor:pointer; border-bottom: 3px solid transparent;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabs button .ico{ font-size:16px; line-height:1; }
  nav.tabs button.active{ color: var(--tab-c, var(--teal-dark)); border-bottom-color: var(--tab-c, var(--teal)); }
  nav.tabs button.active .ico{ transform: scale(1.15); }

  main{ flex:1; padding: 16px 20px 90px; }
  section.view{ display:none; }
  section.view.active{ display:block; animation: reveal 0.35s ease; }
  @keyframes reveal{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform:none; } }

  /* ---- capture frame ---- */
  .capture{
    position: relative; aspect-ratio: 4/3; background: #0F1512; border-radius: 10px; overflow: hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(15,61,55,0.18);
  }
  .capture video, .capture img{ width:100%; height:100%; object-fit: cover; display:block; }
  .capture .empty{ color:#C9D3CE; font-size:12.5px; text-align:center; padding: 0 30px; font-family:'IBM Plex Mono', monospace; }
  .brackets{ position:absolute; inset:14px; pointer-events:none; }
  .brackets svg{ width:100%; height:100%; }
  .brackets path{ stroke:#EDEAD9; stroke-width:2.5; fill:none; opacity:0.85; }

  .zoneframe{ position:absolute; inset:14px; pointer-events:none; display:none; }
  .zoneframe.show{ display:block; }
  .zf-box{
    position:absolute; top:12%; bottom:12%; width:28%;
    border:1.5px dashed rgba(237,234,217,0.55); border-radius:6px;
  }
  .zf-box.zA{ left:3%; border-color:rgba(76,175,125,0.75); } .zf-box.zB{ left:36%; border-color:rgba(224,162,51,0.75); } .zf-box.zD{ right:3%; border-color:rgba(255,138,122,0.75); }
  .zf-box span{
    position:absolute; top:6px; left:50%; transform:translateX(-50%);
    font-size:9.5px; font-family:'IBM Plex Mono', monospace; color:#0F1512;
    background:rgba(237,234,217,0.85); padding:2px 6px; border-radius:4px; white-space:nowrap;
  }

  .hud{ position:absolute; left:8px; right:8px; bottom:8px; display:none; gap:5px; flex-wrap:wrap; pointer-events:none; }
  .hud.show{ display:flex; }
  .chip{
    font-size:10px; padding:4px 8px; border-radius:6px;
    background:rgba(15,21,18,0.74); color:#EDEAD9;
    border:1px solid rgba(237,234,217,0.25);
    font-family:'IBM Plex Mono', monospace; white-space:nowrap;
  }
  .chip.good{ border-color:#4CAF7D; }
  .chip.warn{ border-color:#E0A233; }
  .chip.bad{ border-color:#FF8A7A; color:#FFC0B5; }

  /* auto-capture progress */
  .autodots{ position:absolute; top:10px; left:0; right:0; display:none; justify-content:center; gap:6px; pointer-events:none; }
  .autodots.show{ display:flex; }
  .autodots i{
    width:9px; height:9px; border-radius:50%; background:rgba(237,234,217,0.3); border:1px solid rgba(237,234,217,0.5);
  }
  .autodots i.on{ background:#4CAF7D; border-color:#4CAF7D; box-shadow:0 0 6px rgba(76,175,125,0.8); }

  .capture-controls{ display:flex; gap:10px; margin-top: 12px; }
  .btn{
    flex:1; padding: 12px 10px; border-radius: 10px; border:1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 13.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn.primary{ background: linear-gradient(135deg,var(--teal),var(--teal-dark)); border-color: var(--teal-dark); color:#fff; box-shadow: 0 4px 12px rgba(27,110,99,0.25); }
  .btn.violet{ background: linear-gradient(135deg,#7A5CB8,var(--violet)); border-color: var(--violet); color:#fff; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .hide{ display:none !important; }
  input[type=file]{ display:none; }
  .live-hint{ font-size:12px; color:var(--ink-soft); margin-top:8px; display:none; text-align:center; }
  .live-hint.show{ display:block; }

  /* ---- quality report ---- */
  .card{ border:1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 16px; background: var(--panel); }
  .card h3{ font-size: 13px; color: var(--ink-soft); font-weight:600; margin-bottom: 10px; }
  .qrow{ display:flex; justify-content:space-between; align-items:center; padding: 6px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
  .qrow:last-of-type{ border-bottom:none; }
  .pill{ font-size: 11.5px; padding: 3px 8px; border-radius: 12px; font-weight:600; font-family:'IBM Plex Mono',monospace; }
  .pill.good{ background: var(--teal-tint); color: var(--teal-dark); }
  .pill.warn{ background: var(--amber-tint); color: var(--amber); }
  .pill.bad{ background: var(--danger-tint); color: var(--danger); }

  .readiness{
    display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 14px;
    border-radius:14px; font-size:14.5px; font-weight:700; margin-top:12px; color:#fff;
    box-shadow: 0 5px 14px rgba(15,61,55,0.2);
  }
  .readiness.ready{ background: linear-gradient(135deg,#1B6E63,#2C9A87); }
  .readiness.warn{ background: linear-gradient(135deg,#C77B12,#E0A233); }
  .readiness.fail{ background: linear-gradient(135deg,#A93A2E,#C75C4F); }

  .privacy-line{ margin-top:12px; font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }

  .zones{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-top: 16px; }
  .zone{ border:1px solid var(--line); border-top-width:3px; border-radius:10px; padding: 12px 8px; text-align:center; }
  .zone.a{ border-top-color:#1B6E63; background: linear-gradient(180deg,#F2F8F6,var(--panel)); }
  .zone.b{ border-top-color:#C77B12; background: linear-gradient(180deg,#FCF6EC,var(--panel)); }
  .zone.d{ border-top-color:#A93A2E; background: linear-gradient(180deg,#FAF0ED,var(--panel)); }
  .zone .label{ font-size:12px; font-weight:600; color: var(--ink-soft); }
  .zone .state{ margin-top:8px; font-size: 11px; color:#8A9490; font-family:'IBM Plex Mono',monospace; }

  .note{ font-size: 12px; color: var(--ink-soft); margin-top: 14px; line-height:1.5; }
  .note.fail{ color: var(--danger); font-weight:500; }
  .save-row{ margin-top: 18px; display:flex; gap:10px; }

  /* ---- dashboard ---- */
  .stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom: 16px; }
  .stat-card{ border-radius:12px; padding:14px 8px; color:#fff; text-align:center; box-shadow:0 4px 12px rgba(15,61,55,0.15); }
  .stat-card .num{ font-size:22px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
  .stat-card .lbl{ font-size:9.5px; margin-top:3px; opacity:0.92; font-family:'IBM Plex Mono',monospace; }
  .stat-card.teal{ background:linear-gradient(135deg,#1B6E63,#0F3D37); }
  .stat-card.amber{ background:linear-gradient(135deg,#C77B12,#8A560B); }
  .stat-card.crimson{ background:linear-gradient(135deg,#A93A2E,#6E241B); }

  .chart{ display:flex; align-items:flex-end; gap:4px; height:90px; padding:12px 12px 0; border:1px solid var(--line); border-radius:12px; background: linear-gradient(180deg,#FBFCFC,var(--panel)); margin-bottom:16px; }
  .chart .bar{ flex:1; border-radius:4px 4px 0 0; min-height:4px; }
  .chart .bar.pass{ background:linear-gradient(180deg,#2C9A87,#1B6E63); }
  .chart .bar.warn{ background:linear-gradient(180deg,#E0A233,#C77B12); }
  .chart .bar.fail{ background:linear-gradient(180deg,#C75C4F,#A93A2E); }
  .chart-empty{ font-size:12px; color:var(--ink-soft); text-align:center; padding:20px 10px; }

  .hist-item{ display:flex; gap:12px; border:1px solid var(--line); border-radius:10px; padding: 10px; margin-bottom: 10px; align-items:center; background: linear-gradient(180deg,#FBFCFC,var(--panel)); }
  .hist-item img{ width:56px; height:56px; object-fit:cover; border-radius:8px; background:#eee; }
  .hist-meta{ flex:1; min-width:0; }
  .hist-meta .ts{ font-size:12.5px; font-weight:600; }
  .hist-meta .sum{ font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
  .hist-verdict{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px; font-family:'IBM Plex Mono',monospace; margin-right:4px; white-space:nowrap; }
  .hist-verdict.pass{ background:var(--teal-tint); color:var(--teal-dark); }
  .hist-verdict.warn{ background:var(--amber-tint); color:var(--amber); }
  .hist-verdict.fail{ background:var(--danger-tint); color:var(--danger); }
  .hist-del{ background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer; padding:6px; }
  .empty-hist{ color: var(--ink-soft); font-size: 13px; text-align:center; padding: 40px 10px; }

  /* ---- lab ---- */
  .lab-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .lab-cell{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .lab-cell .k{ font-size:10px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.04em; }
  .lab-cell .v{ font-size:13px; font-weight:600; margin-top:3px; word-break:break-all; }

  table.metrics{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.metrics td{ padding:6px 4px; border-bottom:1px dashed var(--line); }
  table.metrics td:last-child{ text-align:right; font-family:'IBM Plex Mono',monospace; }

  .lab-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }

  /* ---- guide ---- */
  .steps{ display:flex; flex-direction:column; gap:10px; }
  .step{ display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background: linear-gradient(180deg,#FBFCFC,var(--panel)); }
  .step .n{
    flex-shrink:0; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:15px; font-family:'Space Grotesk',sans-serif;
  }
  .step:nth-child(5n+1) .n{ background:linear-gradient(135deg,#1B6E63,#2C9A87); }
  .step:nth-child(5n+2) .n{ background:linear-gradient(135deg,#C77B12,#E0A233); }
  .step:nth-child(5n+3) .n{ background:linear-gradient(135deg,#A93A2E,#C75C4F); }
  .step:nth-child(5n+4) .n{ background:linear-gradient(135deg,#7A5CB8,#6B4FA1); }
  .step:nth-child(5n+5) .n{ background:linear-gradient(135deg,#2C6BA4,#3E8FD0); }
  .step .t{ font-size:13px; font-weight:600; }
  .step .d{ font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }

  footer{
    border-top:1px solid var(--line); padding: 12px 20px; overflow-x:auto; white-space:nowrap; background: var(--panel);
    max-width:460px; margin:0 auto; position:sticky; bottom:0; width:100%;
  }
  .roadmap{ display:inline-flex; gap:14px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; }
  .roadmap span{ color:#B7C0BB; }
  .roadmap span.done{ color:#7C8A84; text-decoration:line-through; text-decoration-color:#D6DEDA; }
  .roadmap span.now{ background: linear-gradient(90deg,#1B6E63,#A93A2E); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }
</style>
</head>
<body>
<div class="frame">

  <div class="disclaimer">
    <span>⚠️</span>
    <span data-i18n="disclaimer"></span>
  </div>

  <div class="hero">
    <div class="hero-canvas" id="heroCanvas"></div>
    <div class="lang-toggle">
      <button id="lang-en" class="active">EN</button>
      <button id="lang-de">DE</button>
    </div>
    <div class="hero-copy">
      <div class="title">BloodScan AI</div>
      <div class="subtitle" data-i18n="subtitle"></div>
    </div>
  </div>

  <nav class="tabs">
    <button id="tab-scan-btn" class="active" style="--tab-c:#1B6E63">
      <span class="ico">📷</span><span data-i18n="tabScan"></span>
    </button>
    <button id="tab-lab-btn" style="--tab-c:#A93A2E">
      <span class="ico">🔬</span><span data-i18n="tabLab"></span>
    </button>
    <button id="tab-dash-btn" style="--tab-c:#C77B12">
      <span class="ico">📊</span><span data-i18n="tabDash"></span>
    </button>
    <button id="tab-guide-btn" style="--tab-c:#6B4FA1">
      <span class="ico">🧭</span><span data-i18n="tabGuide"></span>
    </button>
  </nav>

  <main>
    <!-- ============ SCAN VIEW ============ -->
    <section id="view-scan" class="view active">
      <div class="capture" id="captureBox">
        <video id="video" playsinline muted style="display:none"></video>
        <img id="preview" style="display:none" alt="" />
        <div class="empty" id="captureEmpty" data-i18n="captureEmpty"></div>
        <div class="brackets">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M0,14 L0,0 L14,0" />
            <path d="M86,0 L100,0 L100,14" />
            <path d="M100,86 L100,100 L86,100" />
            <path d="M14,100 L0,100 L0,86" />
          </svg>
        </div>
        <div class="zoneframe" id="zoneFrame">
          <div class="zf-box zA"><span>Anti-A</span></div>
          <div class="zf-box zB"><span>Anti-B</span></div>
          <div class="zf-box zD"><span>Anti-D</span></div>
        </div>
        <div class="autodots" id="autoDots"><i></i><i></i><i></i></div>
        <div class="hud" id="hud"></div>
      </div>

      <p class="live-hint" id="liveHint" data-i18n="liveHint"></p>

      <div class="capture-controls">
        <button class="btn" id="btnCamera" data-i18n="btnCamera"></button>
        <button class="btn" id="btnUpload" data-i18n="btnUpload"></button>
        <button class="btn primary hide" id="btnCapture" data-i18n="btnCapture"></button>
        <button class="btn hide" id="btnFlash" data-i18n="btnFlash"></button>
        <button class="btn hide" id="btnStop" data-i18n="btnStop"></button>
        <input type="file" id="fileInput" accept="image/*" capture="environment" />
      </div>

      <div class="card" id="qualityCard" style="display:none">
        <h3 data-i18n="qualityTitle"></h3>
        <div class="qrow"><span data-i18n="qBrightness"></span><span class="pill" id="qBrightnessVal">—</span></div>
        <div class="qrow"><span data-i18n="qSharpness"></span><span class="pill" id="qSharpnessVal">—</span></div>
        <div class="qrow"><span data-i18n="qGlare"></span><span class="pill" id="qGlareVal">—</span></div>
        <div class="qrow"><span data-i18n="qContrast"></span><span class="pill" id="qContrastVal">—</span></div>
        <div class="qrow"><span data-i18n="qStructure"></span><span class="pill" id="qStructureVal">—</span></div>
        <div class="qrow"><span data-i18n="qResolution"></span><span class="pill" id="qResolutionVal">—</span></div>
        <div class="readiness" id="readinessBadge"></div>
        <div class="privacy-line"><span>🔒</span><span data-i18n="privacyNote"></span></div>
      </div>

      <div class="zones" id="zonesBox" style="display:none">
        <div class="zone a"><div class="label">Anti-A</div><div class="state" data-i18n="zoneState"></div></div>
        <div class="zone b"><div class="label">Anti-B</div><div class="state" data-i18n="zoneState"></div></div>
        <div class="zone d"><div class="label">Anti-D</div><div class="state" data-i18n="zoneState"></div></div>
      </div>

      <p class="note" id="scanNote" data-i18n="scanNote" style="display:none"></p>
      <p class="note fail" id="failNote" data-i18n="failNote" style="display:none"></p>

      <div class="save-row" id="saveRow" style="display:none">
        <button class="btn primary" id="btnSave" data-i18n="btnSave"></button>
        <button class="btn" id="btnDiscard" data-i18n="btnDiscard"></button>
      </div>
    </section>

    <!-- ============ LAB VIEW ============ -->
    <section id="view-lab" class="view">
      <div class="lab-grid">
        <div class="lab-cell"><div class="k" data-i18n="labPlatform"></div><div class="v" id="labPlatform">—</div></div>
        <div class="lab-cell"><div class="k" data-i18n="labScreen"></div><div class="v" id="labScreen">—</div></div>
        <div class="lab-cell"><div class="k" data-i18n="labCamera"></div><div class="v" id="labCamera">—</div></div>
        <div class="lab-cell"><div class="k" data-i18n="labTorch"></div><div class="v" id="labTorch">—</div></div>
      </div>

      <div class="capture-controls" style="margin-top:0">
        <button class="btn" id="btnLabCapture" data-i18n="btnLabCapture"></button>
      </div>

      <div class="card" id="labReportCard" style="display:none">
        <h3 data-i18n="labReportTitle"></h3>
        <table class="metrics" id="labReportTable"></table>
        <div class="capture-controls" style="margin-top:12px">
          <button class="btn violet" id="btnCopyReport" data-i18n="btnCopyReport"></button>
        </div>
        <p class="lab-note" data-i18n="labNote"></p>
      </div>

      <div class="card" id="labHistoryCard" style="display:none">
        <h3 data-i18n="labHistoryTitle"></h3>
        <div id="labHistoryList"></div>
      </div>
    </section>

    <!-- ============ DASHBOARD VIEW ============ -->
    <section id="view-dash" class="view">
      <div class="stats-row" id="statsRow"></div>
      <div class="chart" id="qualityChart"></div>
      <div id="historyList"></div>
      <div class="empty-hist" id="emptyHist" data-i18n="emptyHist"></div>
    </section>

    <!-- ============ GUIDE VIEW ============ -->
    <section id="view-guide" class="view">
      <div class="steps" id="guideSteps"></div>
      <p class="note" data-i18n="guideNote"></p>
    </section>
  </main>

  <footer>
    <div class="roadmap">
      <span class="done">✓ v0.1 UI</span>
      <span class="now">● v0.2 Camera engine</span>
      <span>○ v0.3 Card CV</span>

      chartTitle: "Qualitätsverlauf",
      labPlatform: "Gerät", labScreen: "Bildschirm", labCamera: "Kamera", labTorch: "Blitz",

      labHistoryTitle: "Gespeicherte Referenzaufnahmen",

  };

  let lang = 'en';
  let currentDataUrl = null;
  let stream = null;
  let liveTimer = null;
  let torchOn = false;
  let torchable = false;
  let goodStreak = 0;      // consecutive good live frames -> auto capture
  let lastReport = null;

  const $ = (id)=> document.getElementById(id);
  function t(key){ return STRINGS[lang][key] || key; }

  function applyI18n(){
    $('html-root').lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
    $('lang-en').classList.toggle('active', lang==='en');
    $('lang-de').classList.toggle('active', lang==='de');
    if(lastReport) renderQuality(lastReport);
    renderGuide();
    renderHistory();
    renderLabHistory();
  }
  $('lang-en').onclick = ()=>{ lang='en'; applyI18n(); };
  $('lang-de').onclick = ()=>{ lang='de'; applyI18n(); };

  // ---- tabs ----
  const tabs = [
    { btn: 'tab-scan-btn', view: 'view-scan', onStop: true },
    { btn: 'tab-lab-btn', view: 'view-lab' },
    { btn: 'tab-dash-btn', view: 'view-dash', render: renderHistory },
    { btn: 'tab-guide-btn', view: 'view-guide' }
  ];
  tabs.forEach(tab=>{
    $(tab.btn).onclick = ()=>{
      tabs.forEach(x=>{ $(x.btn).classList.remove('active'); $(x.view).classList.remove('active'); });
      $(tab.btn).classList.add('active');
      $(tab.view).classList.add('active');
      if(tab.render) tab.render();
    };
  });

  /* ================================================================
     v0.2 CAMERA ENGINE (thresholds tuned for real phone captures)
     ================================================================ */

  const video = $('video');
  const preview = $('preview');
  const captureEmpty = $('captureEmpty');
  const fileInput = $('fileInput');
  const hud = $('hud');
  const autoDots = $('autoDots');

  const btnCamera = $('btnCamera');
  const btnUpload = $('btnUpload');
  const btnCapture = $('btnCapture');
  const btnFlash = $('btnFlash');
  const btnStop = $('btnStop');

  // ---------- quality metrics (unit-tested) ----------
  function computeMetrics(img){
    const d = img.data, w = img.width, h = img.height, n = w * h;
    const gray = new Float32Array(n);
    let sum = 0, glarePx = 0;
    for(let i = 0; i < n; i++){
      const y = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2];
      gray[i] = y; sum += y;
      if(y >= 250) glarePx++;
    }
    const mean = sum / n;
    let v = 0;
    for(let i = 0; i < n; i++) v += (gray[i] - mean) ** 2;
    const std = Math.sqrt(v / n);

    let ls = 0, lsq = 0, cnt = 0, edges = 0;
    for(let y = 1; y < h - 1; y++){
      for(let x = 1; x < w - 1; x++){
        const i = y * w + x;
        const lap = 4*gray[i] - gray[i-1] - gray[i+1] - gray[i-w] - gray[i+w];
        ls += lap; lsq += lap*lap; cnt++;
        if(Math.abs(gray[i+1]-gray[i-1]) + Math.abs(gray[i+w]-gray[i-w]) > 60) edges++;
      }
    }
    const lm = ls / cnt;
    return {
      mean: Math.round(mean),
      contrast: Math.round(std),
      glarePct: Math.round(100 * 100 * glarePx / n) / 100,
      blurScore: Math.round(lsq / cnt - lm * lm),
      edgePct: Math.round(100 * 100 * edges / cnt) / 100
    };
  }

  function judgeQuality(m, resW, resH){
    const checks = [];
    const add = (name, value, state, hint)=>{
      const word = state === 'pass' ? t('good') : state === 'warn' ? t('ok') : t('low');
      checks.push({ name, value, state, label: value + ' · ' + word, hint: state !== 'pass' ? hint : '' });
    };

    const blurState = m.blurScore >= 45 ? 'pass' : m.blurScore >= 20 ? 'warn' : 'fail';
    add('qSharpness', String(m.blurScore), blurState, t('low') + ' — ' + (lang==='de' ? 'ruhig halten, Fokus abwarten.' : 'hold steady, let focus lock.'));

    const bState = m.mean < 35 ? 'fail' : m.mean < 55 ? 'warn' : m.mean > 245 ? 'fail' : m.mean > 220 ? 'warn' : 'pass';
    add('qBrightness', m.mean + '/255', bState, (m.mean < 55 ? t('low') : t('high')) + ' — ' + (lang==='de' ? (m.mean < 55 ? 'mehr Licht.' : 'weniger Licht/Belichtung.') : (m.mean < 55 ? 'add light.' : 'reduce light/exposure.')));

    const gState = m.glarePct >= 6 ? 'fail' : m.glarePct >= 2 ? 'warn' : 'pass';
    add('qGlare', m.glarePct + '%', gState, lang==='de' ? 'Reflexe — Winkel ändern.' : 'Reflections — change angle.');

    const cState = m.contrast < 18 ? 'fail' : m.contrast < 28 ? 'warn' : 'pass';
    add('qContrast', String(m.contrast), cState, lang==='de' ? 'flaches Licht.' : 'flat lighting.');

    const eState = m.edgePct >= 1.5 ? 'pass' : m.edgePct >= 0.6 ? 'warn' : 'fail';
    add('qStructure', m.edgePct + '%', eState, lang==='de' ? 'keine kartenähnliche Struktur — Karte in den Rahmen legen.' : 'no card-like structure — place the card in the frame.');

    const longest = Math.max(resW, resH);
    const rState = longest >= 1280 ? 'pass' : longest >= 960 ? 'warn' : 'fail';
    add('qResolution', resW + '×' + resH, rState, lang==='de' ? 'Auflösung zu niedrig.' : 'Resolution too low.');

    const verdict = checks.some(c=>c.state==='fail') ? 'fail' : checks.some(c=>c.state==='warn') ? 'warn' : 'pass';
    return { metrics: m, checks, verdict };
  }

  // ---------- live camera + easy auto-capture ----------
  async function openCamera(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
    }catch(err){
      alert(t('cameraError'));
      return;
    }
    video.srcObject = stream;
    video.style.display = 'block';
    preview.style.display = 'none';
    captureEmpty.style.display = 'none';
    await new Promise(r=>{ video.onloadedmetadata = r; });
    await video.play();

    try{
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      torchable = 'torch' in caps;
      $('labCamera').textContent = (video.videoWidth + '×' + video.videoHeight);
      $('labTorch').textContent = torchable ? t('labYes') : t('labNo');
    }catch(e){ torchable = false; }

    btnCamera.classList.add('hide');
    btnUpload.classList.add('hide');
    btnCapture.classList.remove('hide');
    btnStop.classList.remove('hide');
    btnFlash.classList.toggle('hide', !torchable);
    $('zoneFrame').classList.add('show');
    $('liveHint').classList.add('show');
    hud.classList.add('show');
    autoDots.classList.add('show');
    goodStreak = 0;
    updateAutoDots();
    liveTimer = setInterval(liveCheck, 600);
  }

  function updateAutoDots(){
    [...autoDots.children].forEach((dot, i)=> dot.classList.toggle('on', i < goodStreak));
  }

  function stopCamera(){
    clearInterval(liveTimer); liveTimer = null;
    if(stream){ stream.getTracks().forEach(tr=>tr.stop()); stream = null; }
    torchOn = false;
    video.style.display = 'none';
    video.srcObject = null;
    btnCamera.classList.remove('hide');
    btnUpload.classList.remove('hide');
    btnCapture.classList.add('hide');
    btnStop.classList.add('hide');
    btnFlash.classList.add('hide');
    $('zoneFrame').classList.remove('show');
    $('liveHint').classList.remove('show');
    hud.classList.remove('show');
    autoDots.classList.remove('show');
    hud.innerHTML = '';
    goodStreak = 0;
  }

  async function toggleFlash(){
    if(!stream || !torchable) return;
    const track = stream.getVideoTracks()[0];
    try{
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      btnFlash.textContent = torchOn ? t('btnFlashOff') : t('btnFlash');
    }catch(e){ torchOn = false; }
  }

  const liveCanvas = document.createElement('canvas');
  liveCanvas.width = 320; liveCanvas.height = 240;
  const liveCtx = liveCanvas.getContext('2d', { willReadFrequently: true });

  function liveCheck(){
    if(!stream || !video.videoWidth) return;
    liveCtx.drawImage(video, 0, 0, 320, 240);
    const m = computeMetrics(liveCtx.getImageData(0, 0, 320, 240));
    const r = judgeQuality(m, video.videoWidth, video.videoHeight);
    const order = { fail: 0, warn: 1, pass: 2 };
    hud.innerHTML = '';
    [...r.checks].sort((a,b)=> order[a.state] - order[b.state]).forEach(c=>{
      const chip = document.createElement('span');
      chip.className = 'chip ' + c.state;
      chip.textContent = t(c.name) + ' ' + c.value;
      hud.appendChild(chip);
    });

    // EASY MODE: auto-capture after 3 consecutive good frames (~1.8 s)
    if(r.verdict === 'pass'){
      goodStreak = Math.min(3, goodStreak + 1);
      updateAutoDots();
      if(goodStreak >= 3) captureNow();
    }else{
      goodStreak = 0;
      updateAutoDots();
    }
  }

  function captureNow(){
    if(!stream || !video.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    const dataUrl = c.toDataURL('image/jpeg', 0.85);
    const resW = c.width, resH = c.height;
    stopCamera();
    showImage(dataUrl, resW, resH);
  }

  // ---------- upload ----------
  btnUpload.onclick = ()=> fileInput.click();
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    stopCamera();
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=> showImage(ev.target.result, img.naturalWidth, img.naturalHeight);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // ---------- result ----------
  function showImage(dataUrl, resW, resH){
    currentDataUrl = dataUrl;
    preview.src = dataUrl;
    preview.style.display = 'block';
    video.style.display = 'none';
    captureEmpty.style.display = 'none';

    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, 1280 / Math.max(resW, resH));
      const w = Math.round(resW * scale), h = Math.round(resH * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const report = judgeQuality(computeMetrics(ctx.getImageData(0, 0, w, h)), resW, resH);
      lastReport = report;
      renderQuality(report);
    };
    img.src = dataUrl;
  }

  function renderQuality(report){
    const ids = {
      qSharpness: 'qSharpnessVal', qBrightness: 'qBrightnessVal', qGlare: 'qGlareVal',
      qContrast: 'qContrastVal', qStructure: 'qStructureVal', qResolution: 'qResolutionVal'
    };
    const cls = { pass: 'pill good', warn: 'pill warn', fail: 'pill bad' };
    report.checks.forEach(ch=>{
      const el = $(ids[ch.name]);
      if(el){ el.textContent = ch.label; el.className = cls[ch.state]; }
    });

    const badge = $('readinessBadge');
    if(report.verdict === 'pass'){ badge.textContent = t('verdictPass'); badge.className = 'readiness ready'; }
    else if(report.verdict === 'warn'){ badge.textContent = t('verdictWarn'); badge.className = 'readiness warn'; }
    else { badge.textContent = t('verdictFail'); badge.className = 'readiness fail'; }

    $('qualityCard').style.display = 'block';
    $('scanNote').style.display = 'block';
    $('saveRow').style.display = 'flex';

    // v0.2 design rule: a failing image is REFUSED, not analyzed.
    const refused = report.verdict === 'fail';
    $('failNote').style.display = refused ? 'block' : 'none';
    $('zonesBox').style.display = refused ? 'none' : 'grid';
    $('btnSave').disabled = refused;
  }

  $('btnDiscard').onclick = resetCapture;
  function resetCapture(){
    currentDataUrl = null;
    lastReport = null;
    stopCamera();
    preview.style.display = 'none';
    captureEmpty.style.display = 'block';
    $('qualityCard').style.display = 'none';
    $('zonesBox').style.display = 'none';
    $('scanNote').style.display = 'none';
    $('failNote').style.display = 'none';
    $('saveRow').style.display = 'none';
  }

  /* ================================================================
     DEVICE LAB — reference reports for cross-device comparison
     ================================================================ */
  let labReport = null;

  function initLabInfo(){
    $('labPlatform').textContent = (navigator.userAgent.match(/Android|iPhone|iPad/i) || [navigator.platform || '—'])[0];
    $('labScreen').textContent = window.screen.width + '×' + window.screen.height + ' @' + (window.devicePixelRatio || 1) + 'x';
    $('labTorch').textContent = torchable ? t('labYes') : t('labNo');
  }

  $('btnLabCapture').onclick = async ()=>{
    try{
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      const v = document.createElement('video');
      v.srcObject = s; v.muted = true; v.playsInline = true;
      await new Promise(r=>{ v.onloadedmetadata = r; });
      await v.play();
      await new Promise(r=> setTimeout(r, 350)); // let exposure settle
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      const full = c.toDataURL('image/jpeg', 0.85);
      $('labCamera').textContent = c.width + '×' + c.height;
      s.getTracks().forEach(tr=>tr.stop());

      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, 1280 / Math.max(c.width, c.height));
        const w = Math.round(c.width * scale), h = Math.round(c.height * scale);
        const cc = document.createElement('canvas');
        cc.width = w; cc.height = h;
        const ctx = cc.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        const m = computeMetrics(ctx.getImageData(0, 0, w, h));
        labReport = { ts: new Date().toISOString(), device: $('labPlatform').textContent, screen: $('labScreen').textContent, resolution: c.width + '×' + c.height, metrics: m };
        renderLabReport();
      };
      img.src = full;
    }catch(err){
      alert(t('cameraError'));
    }
  };

  function renderLabReport(){
    if(!labReport) return;
    const m = labReport.metrics;
    $('labReportTable').innerHTML = [
      ['qSharpness', m.blurScore], ['qBrightness', m.mean + '/255'], ['qGlare', m.glarePct + '%'],
      ['qContrast', m.contrast], ['qStructure', m.edgePct + '%'], ['qResolution', labReport.resolution]
    ].map(row=> `<tr><td>${t(row[0])}</td><td>${row[1]}</td></tr>`).join('');
    $('labReportCard').style.display = 'block';
  }

  $('btnCopyReport').onclick = async ()=>{
    if(!labReport) return;
    const payload = { app: 'BloodScan AI v0.2.2', ...labReport };
    try{ await navigator.clipboard.writeText(JSON.stringify(payload, null, 2)); }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = JSON.stringify(payload, null, 2);
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    $('btnCopyReport').textContent = t('labCopied');
    setTimeout(()=>{ $('btnCopyReport').textContent = t('btnCopyReport'); }, 2000);

    const list = loadLabHistory();
    list.unshift(labReport);
    persistLabHistory(list.slice(0, 20));
    renderLabHistory();
  };

  const LKEY = 'bloodscan:lab';
  function loadLabHistory(){
    try{ const s = localStorage.getItem(LKEY); return s ? JSON.parse(s) : []; }
    catch(e){ return []; }
  }
  function persistLabHistory(list){
    try{ localStorage.setItem(LKEY, JSON.stringify(list)); }catch(e){}
  }
  function renderLabHistory(){
    const list = loadLabHistory();
    const el = $('labHistoryList');
    if(!list.length){ $('labHistoryCard').style.display = 'none'; return; }
    $('labHistoryCard').style.display = 'block';
    el.innerHTML = list.map(r=>{
      const m = r.metrics;
      return `<div class="hist-item" style="display:block">
        <div class="ts">${r.device} · ${r.ts.replace('T',' ').slice(0,16)}</div>
        <div class="sum">${t('qSharpness')} ${m.blurScore} · ${t('qGlare')} ${m.glarePct}% · ${t('qBrightness')} ${m.mean}/255 · ${t('qContrast')} ${m.contrast} · ${t('qStructure')} ${m.edgePct}%</div>
      </div>`;
    }).join('');
  }

  /* ================================================================
     DASHBOARD — colorful stats + quality chart + history
     ================================================================ */
  const HKEY = 'bloodscan:history';
  function loadHistory(){
    try{ const s = localStorage.getItem(HKEY); return s ? JSON.parse(s) : []; }
    catch(e){ return []; }
  }
  function persistHistory(list){
    try{ localStorage.setItem(HKEY, JSON.stringify(list)); }catch(e){}
  }
  function thumb(dataUrl, cb){
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = 96; c.height = 96;
      c.getContext('2d').drawImage(img, 0, 0, 96, 96);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = dataUrl;
  }

  $('btnSave').onclick = ()=>{
    if(!currentDataUrl || !lastReport || lastReport.verdict === 'fail') return;
    thumb(currentDataUrl, (thumbUrl)=>{
      const m = lastReport.metrics;
      const list = loadHistory();
      list.unshift({
        id: Date.now(),
        ts: new Date().toLocaleString(lang==='de' ? 'de-DE' : 'en-GB'),
        thumb: thumbUrl,
        verdict: lastReport.verdict,
        blur: m.blurScore,
        glare: m.glarePct,
        bright: m.mean
      });
      persistHistory(list.slice(0, 50));
      resetCapture();
      $('tab-dash-btn').click();
    });
  };

  function renderHistory(){
    const listEl = $('historyList');
    const emptyEl = $('emptyHist');
    const statsEl = $('statsRow');
    const chartEl = $('qualityChart');
    const list = loadHistory();

    if(list.length === 0){
      statsEl.innerHTML = '';
      chartEl.innerHTML = `<div class="chart-empty">${t('chartTitle')}</div>`;
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    const goodCount = list.filter(x=>x.verdict === 'pass').length;
    const last = list[0];
    statsEl.innerHTML = `
      <div class="stat-card teal"><div class="num">${list.length}</div><div class="lbl">${t('statsTotal')}</div></div>
      <div class="stat-card amber"><div class="num">${goodCount}</div><div class="lbl">${t('statsGood')}</div></div>
      <div class="stat-card crimson"><div class="num">${last.ts.split(',')[0]}</div><div class="lbl">${t('statsLast')}</div></div>
    `;

    // simple bar chart: last 20 scans, bar height = quality score
    const bars = list.slice(0, 20).reverse();
    const maxBlur = Math.max(60, ...bars.map(b=> b.blur || 0));
    chartEl.innerHTML = bars.map(b=>{
      const pct = Math.max(8, Math.min(100, (b.blur || 0) / maxBlur * 100));
      return `<div class="bar ${b.verdict}" style="height:${pct}%" title="${b.ts}"></div>`;
    }).join('');

    listEl.innerHTML = '';
    list.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'hist-item';
      const vTxt = item.verdict === 'pass' ? '✓' : item.verdict === 'warn' ? '↻' : '✕';
      row.innerHTML = `
        <img src="${item.thumb}" alt="" />
        <div class="hist-meta">
          <div class="ts">${item.ts}</div>
          <div class="sum">${t('qSharpness')} ${item.blur ?? '—'} · ${t('qGlare')} ${item.glare ?? '—'}% · ${t('qBrightness')} ${item.bright ?? '—'}</div>
        </div>
        <span class="hist-verdict ${item.verdict}">${vTxt}</span>
        <button class="hist-del" data-id="${item.id}">${t('delete')}</button>
      `;
      row.querySelector('.hist-del').onclick = ()=>{
        persistHistory(loadHistory().filter(x=>x.id !== item.id));
        renderHistory();
      };
      listEl.appendChild(row);
    });
  }

  /* ================================================================
     GUIDE
     ================================================================ */
  function renderGuide(){
    const keys = ['g1','g2','g3','g4','g5','g6'];
    $('guideSteps').innerHTML = keys.map((k, i)=>
      `<div class="step"><div class="n">${i+1}</div><div><div class="t">${t(k+'t')}</div><div class="d">${t(k+'d')}</div></div></div>`
    ).join('');
  }

  /* ================================================================
     HERO (decorative)
     ================================================================ */
  let rafId = null;
  function initHero(){
    const holder = $('heroCanvas');
    if(typeof THREE === 'undefined' || !holder) return;
    try{
      const w = holder.clientWidth, h = holder.clientHeight;
      const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true, powerPreference:'low-power' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h);
      holder.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, w/h, 0.1, 20);
      camera.position.set(0, 0.35, 3.3);
      camera.lookAt(0, 0.55, 0);

      scene.add(new THREE.HemisphereLight(0xffe6df, 0x140a08, 0.65));
      const key = new THREE.PointLight(0xffffff, 1.3); key.position.set(2.2, 3, 2.5); scene.add(key);
      const rim = new THREE.PointLight(0xff6a52, 0.8); rim.position.set(-2, -0.5, 2); scene.add(rim);

      const pts = [
        new THREE.Vector2(0.00, 0.00),
        new THREE.Vector2(0.55, 0.05),
        new THREE.Vector2(0.78, 0.38),
        new THREE.Vector2(0.68, 0.80),
        new THREE.Vector2(0.42, 1.15),
        new THREE.Vector2(0.14, 1.38),
        new THREE.Vector2(0.00, 1.52)
      ];
      const dropGeo = new THREE.LatheGeometry(pts, 32);
      const dropMat = new THREE.MeshPhysicalMaterial({
        color: 0xB3221B, roughness:0.22, metalness:0.05, clearcoat:1, clearcoatRoughness:0.12
      });
      const drop = new THREE.Mesh(dropGeo, dropMat);
      drop.position.y = -0.5;
      const dropGroup = new THREE.Group();
      dropGroup.add(drop);
      scene.add(dropGroup);

      const cellMat = new THREE.MeshStandardMaterial({ color:0xD1483A, roughness:0.4, metalness:0.05 });
      const cells = [];
      for(let i=0;i<7;i++){
        const geo = new THREE.SphereGeometry(0.09 + Math.random()*0.03, 12, 12);
        const m = new THREE.Mesh(geo, cellMat);
        m.scale.y = 0.35;
        scene.add(m);
        cells.push({
          mesh:m,
          radius: 1.15 + Math.random()*0.55,
          speed: 0.25 + Math.random()*0.35,
          phase: Math.random()*Math.PI*2,
          yBase: 0.15 + Math.random()*0.9,
          yAmp: 0.06 + Math.random()*0.06
        });
      }

      let hidden = document.hidden;
      document.addEventListener('visibilitychange', ()=>{
        hidden = document.hidden;
        if(!hidden && rafId === null) animate();
      });

      const clock = new THREE.Clock();
      function animate(){
        if(hidden){ rafId = null; return; }
        rafId = requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        dropGroup.rotation.y = t * 0.35;
        dropGroup.position.y = Math.sin(t*1.1) * 0.06;
        cells.forEach(c=>{
          const a = t*c.speed + c.phase;
          c.mesh.position.set(Math.cos(a)*c.radius, c.yBase + Math.sin(t*0.6+c.phase)*c.yAmp, Math.sin(a)*c.radius*0.6 - 0.3);
        });
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', ()=>{
        const nw = holder.clientWidth, nh = holder.clientHeight;
        if(nw===0||nh===0) return;
        camera.aspect = nw/nh; camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      });
    }catch(e){ console.warn('3D hero skipped:', e); }
  }

  // ---- wire up ----
  btnCamera.onclick = openCamera;
  btnCapture.onclick = captureNow;
  btnStop.onclick = ()=>{ stopCamera(); if(!currentDataUrl){ preview.style.display='none'; captureEmpty.style.display='block'; } };
  btnFlash.onclick = toggleFlash;

  initLabInfo();
  applyI18n();
  initHero();
})();
</script>
</body>
</html>
